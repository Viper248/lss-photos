{% extends "admin_base.html" %}
{% from "macros.html" import section_options, date_field %}
{% block title %}Upload | Admin | {{ SITE }}{% endblock %}
{% block admin %}
<h1>Upload photos</h1>
<div class="bar"></div>

<form id="up" class="form" action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
  <label>Gallery
    <select name="gallery_id">
      <option value="">+ New gallery</option>
      {% for gal in galleries %}<option value="{{ gal.id }}"{{ ' selected' if gal.id == selected }}>{{ gal.title }}</option>{% endfor %}
    </select>
  </label>
  <div class="new">
    <label>Title <input name="title" placeholder="Field Hockey vs. Greenwich"></label>
    <label>Section <select name="section_id">{{ section_options(sections) }}</select></label>
    <label>Date {{ date_field("date", today()) }}</label>
    <label>Description <textarea name="description" rows="2"></textarea></label>
  </div>
  <label>Photos <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" multiple required></label>
  <div class="row"><button class="btn">Upload</button><span id="msg" role="status"></span></div>
</form>
{% endblock %}

{% block script %}
<script>
const up = document.getElementById('up'), msg = document.getElementById('msg');
up.onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(up), files = fd.getAll('photo'), failed = [];
  if (!fd.get('gallery_id') && !fd.get('title').trim()) return alert('Give the new gallery a title.');
  up.querySelector('button').disabled = true;
  for (const [n, file] of files.entries()) {  // one request per photo: progress, and no giant uploads
    msg.textContent = `Uploading ${n + 1} of ${files.length}…`;
    fd.set('photo', file);
    const r = await fetch(up.action, {method: 'POST', body: fd}).catch(() => null);
    if (r && r.ok) fd.set('gallery_id', (await r.json()).gallery_id);
    else failed.push(r ? await r.text() : `${file.name}: network error`);
  }
  if (failed.length) alert('Some photos were not uploaded:\n\n' + failed.join('\n'));
  location = fd.get('gallery_id') ? '/admin/g/' + fd.get('gallery_id') : '/admin';
};
</script>
{% endblock %}
